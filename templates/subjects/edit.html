{% extends 'base.html' %}{% block content %}<section class="form-card">
    <h1>Edit {{ subject.subject_name }}</h1>
    <form method="post"><label>Subject name<input name="subject_name" value="{{ subject.subject_name }}"
                required></label><label>Credits<input type="number" name="credits" value="{{ subject.credits }}"
                min="0"></label><label>Priority<select name="priority">{% for level in ['High','Medium','Low'] %}<option
                    {% if subject.priority==level %}selected{% endif %}>{{ level }}</option>{% endfor
                %}</select></label><button>Save changes</button></form>
</section>{% endblock %}
