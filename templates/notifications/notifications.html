{% extends 'base.html' %}{% block content %}<div class="page-head">
    <h1>Notifications</h1>
    <form method="post" action="{{ url_for('notification.read_all') }}"><button class="secondary">Mark all read</button>
    </form>
</div>
<section class="card">{% for item in items %}<div class="plan {% if not item.is_read %}unread{% endif %}"><b>{{
            item.message }}</b><span>{{ item.created_at }}</span></div>{% else %}<p>You are all caught up.</p>{% endfor
    %}</section>{% endblock %}
