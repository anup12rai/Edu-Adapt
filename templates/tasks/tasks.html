{% extends 'base.html' %}{% block content %}<div class="page-head"><h1>Tasks</h1></div><section class="card"><h2>New task</h2><form method="post" class="task-form"><input name="title" placeholder="What needs to be done?" required><input type="date" name="due_date"><select name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select><input name="description" placeholder="Optional detail"><button>Add</button></form></section><section class="card"><h2>All tasks</h2>{% for task in tasks %}<div class="plan"><div><b class="{% if task.status == 'Completed' %}done{% endif %}">{{ task.title }}</b><p>{{ task.due_date or 'No due date' }} · {{ task.priority }} · {{ task.status }}</p></div><div class="actions"><form method="post" action="{{ url_for('task.toggle',task_id=task.id) }}"><button class="secondary">{{ 'Reopen' if task.status == 'Completed' else 'Complete' }}</button></form><form method="post" action="{{ url_for('task.delete',task_id=task.id) }}"><button class="danger">Delete</button></form></div></div>{% else %}<p>Nothing on your list yet.</p>{% endfor %}</section>{% endblock %}
